name: Build Windows VST3

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: GranularReverb-VST3-Windows
          path: build/GranularReverb_artefacts/Release/VST3/Granular Reverb.vst3/
